---
prepare-commit-msg:
  commands:
    koji:
      interactive: true
      run: koji --hook --yes
commit-msg:
  commands:
    conventional-commits:
      run: cog verify --file {1}
pre-commit:
  parallel: true
  commands:
    clang-format:
      glob: "*.{h,c,hpp,cpp,cc}"
      run: clang-format -i {staged_files}
      stage_fixed: true
    clang-tidy:
      glob: "*.{h,c,hpp,cpp,cc}"
      run: clang-tidy -p build {staged_files}
    iwyu:
      glob: "*.{h,c,hpp,cpp,cc}"
      run: include-what-you-use -p build {staged_files}
    go-fmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    go-vet:
      glob: "*.go"
      run: go vet ./...
    go-lint:
      glob: "*.go"
      run: golangci-lint run --fix ./...
      stage_fixed: true
    yaml-format:
      glob: "*.{yaml,yml}"
      run: yamlfmt {staged_files}
      stage_fixed: true
    yaml-lint:
      glob: "*.{yaml,yml}"
      run: yamllint {staged_files}
    rumdl-format:
      glob: "*.md"
      run: rumdl fmt {staged_files}
      stage_fixed: true
    hadolint-format:
      glob: "**/Dockerfile*"
      run: hadolint {staged_files}
      stage_fixed: true
    gitleaks:
      glob: "*"
      run: gitleaks protect --staged --verbose
