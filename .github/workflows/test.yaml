---
name: Test task-lsp
on:
  push:
    branches:
    - develop
  pull_request:
    branches:
    - main
    - develop
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.23"
    - name: Test
      run: |
        go test -v ./...
