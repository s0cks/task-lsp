---
name: Release task-lsp
on:
  push:
    branches:
    - main
  release:
    types:
    - published
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
    - uses: googleapis/release-please-action@v4
      id: release
  test:
    runs-on: ubuntu-latest
    needs:
    - release-please
    if: ${{ github.event_name == 'release' || needs.release-please.outputs.releases_created == 'true' }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.23"
    - name: Test
      run: |
        go test -v ./...
  compile:
    needs:
    - test
    strategy:
      matrix:
        include:
        - runner: ubuntu-latest
          os: linux
          arch: amd64
          target: linux-x64
          ext: ""
        - runner: macos-14
          os: darwin
          arch: arm64
          target: macos-arm64
          ext: ""
        - runner: macos-13
          os: darwin
          arch: amd64
          target: macos-x64
          ext: ""
        - runner: windows-latest
          os: windows
          arch: amd64
          target: win-x64
          ext: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Install Toolchain (Linux)
      if: matrix.runner == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang \
          lld \
          meson \
          ninja-build
    - name: Install Toolchain (macOS)
      if: startsWith(matrix.runner, 'macos')
      run: |
        brew install \
          meson \
          ninja
    - name: Install Toolchain (Windows)
      if: matrix.runner == 'windows-latest'
      run: |
        pip install \
          meson \
          ninja
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.23"
    - name: Setup Nodejs & pnpm
      uses: pnpm/action-setup@v4
      with:
        version: "12.3.4"
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'
        cache-dependency-path: 'vscode/pnpm-lock.yaml'
    - name: Build LSP
      run: |
        VERSION="${{ needs.release-please.outputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
        fi

        export CGO_ENABLED=1
        export GOOS=${{ matrix.os }}
        export GOARCH=${{ matrix.arch }}

        if [ "${{ matrix.runner }}" = "windows-latest" ]; then
          export CC=clang
          export CXX=clang++
        elif [ "${{ matrix.os }}" = "linux" ]; then
          export CC=clang
          export CXX=clang++
          export LD=lld
        fi

        meson setup build
        meson compile -C build
        meson test -C build

        go build -ldflags="-X main.Version=$VERSION -s -w" \
          -o taskfile-lsp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} \
          cmd/taskfile-lsp/main.go
    - name: Build VSCode Extension
      run: |
        cd vscode
        pnpm install --frozen-lockfile
        npx @vscode/vsce package --target ${{ matrix.target }}
    - name: Upload Artifacts to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name }}
        files: |
          taskfile-lsp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          vscode/*.vsix
